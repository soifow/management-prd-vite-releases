```yaml
name: Sync latest.json

# 触发条件：在【本发布仓库】创建/发布一个新的 Release 时
on:
  release:
    types: [published]

permissions:
  contents: write   # 允许 workflow 回写 latest.json 到 main 分支

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 发布仓库
        uses: actions/checkout@v4

      - name: 生成 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 取本仓库最新 published release 的元数据
          LATEST_JSON=$(gh release view --json tagName,name,publishedAt,url,body)
          VERSION_TAG=$(echo "$LATEST_JSON" | jq -r '.tagName' | sed 's/^v//')
          NAME=$(echo "$LATEST_JSON" | jq -r '.name')
          PUBLISHED_AT=$(echo "$LATEST_JSON" | jq -r '.publishedAt')
          URL=$(echo "$LATEST_JSON" | jq -r '.url')
          BODY=$(echo "$LATEST_JSON" | jq -r '.body')

          # 组装清单（用 jq 安全转义 release notes）
          jq -n \
            --arg version "$VERSION_TAG" \
            --arg name "$NAME" \
            --arg released_at "$PUBLISHED_AT" \
            --arg release_url "$URL" \
            --arg notes "$BODY" \
            '{version:$version, name:$name, released_at:$released_at, release_url:$release_url, notes:$notes}' \
            > latest.json

          echo "生成完毕："; cat latest.json

      - name: 提交 latest.json 到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore: sync latest.json for ${VERSION_TAG:-release}" || echo "无变更，跳过提交"
          git push
```
